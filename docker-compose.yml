services:
  hub:
    image: nginx:alpine
    container_name: portfolio-hub
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hub.rule=Host(`lab.zanza-creation.com`) && Path(`/`)"
      - "traefik.http.routers.hub.entrypoints=websecure"
      - "traefik.http.routers.hub.tls.certresolver=myresolver"

networks:
  web:
    external: true