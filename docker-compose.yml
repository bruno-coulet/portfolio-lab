services:
  hub:
    image: nginx:alpine
    container_name: portfolio
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hub.rule=Host(`lab.zanza-creation.com`)"
      - "traefik.http.routers.hub.entrypoints=websecure"
      - "traefik.http.routers.hub.tls.certresolver=myresolver"
      - "traefik.http.services.hub.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
